{% extends 'base.html' %}{% block title %}Edit Examination{% endblock %}{% block heading %}Edit examination{% endblock %}{% block content %}<div class="panel narrow"><form method="post" class="formgrid"><label>Examination name<input name="exam_name" value="{{ item.exam_name }}" required></label><label>Examination date<input type="date" name="exam_date" value="{{ item.exam_date }}" required></label><label>Session<select name="session">{% for s in ['Morning','Afternoon','Evening'] %}<option value="{{ s }}" {% if item.session==s %}selected{% endif %}>{{ s }}</option>{% endfor %}</select></label><label>Subject name<input name="subject_name" value="{{ item.subject_name or '' }}"></label><label>Subject code<input name="subject_code" value="{{ item.subject_code or '' }}"></label><label>Semester<input name="semester" value="{{ item.semester or '' }}"></label><div class="actions full"><button class="btn">Save changes</button><a class="btn secondary" href="{{ url_for('core.examinations') }}">Cancel</a></div></form></div>{% endblock %}
